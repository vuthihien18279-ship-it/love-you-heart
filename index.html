
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Happiness ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #09000d;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* MÀN HÌNH CÂU HỎI */
.question {
    text-align: center;
    padding: 25px;
    animation: appear 1s ease;
}

.question h1 {
    font-size: clamp(25px, 5vw, 38px);
    color: #ff80ab;
    text-shadow: 0 0 20px #ff174d;
    margin-bottom: 18px;
}

.question p {
    font-size: 17px;
    color: #ffd5e2;
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

button {
    padding: 14px 28px;
    border: 1px solid #ff4d85;
    border-radius: 30px;
    background: #ff174d;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px #ff174d;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.12);
    background: #ff6090;
    box-shadow: 0 0 30px #ff174d;
}

.skip {
    background: transparent;
    border-color: #ff80ab;
}

/* MÀN HÌNH TRÁI TIM */
.heart-screen {
    display: none;
    width: 100%;
    height: 100vh;
    justify-content: center;
    align-items: center;
    animation: appear 1s ease;
}

.container {
    position: relative;
    width: 350px;
    height: 350px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.heart {
    position: absolute;
    width: 150px;
    height: 150px;
    background: #ff174d;
    transform: rotate(-45deg);
    animation: heartbeat 1s infinite;
    box-shadow: 0 0 30px #ff174d,
                0 0 70px #ff174d;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 150px;
    height: 150px;
    background: #ff174d;
    border-radius: 50%;
}

.heart::before {
    top: -75px;
}

.heart::after {
    left: 75px;
}

@keyframes heartbeat {
    0%, 100% { scale: 1; }
    50% { scale: 1.12; }
}

/* VÒNG CHỮ LOVE */
.border-text {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    animation: rotate 8s linear infinite;
}

.border-text span {
    position: absolute;
    left: 50%;
    top: 0;
    transform-origin: 0 150px;
    color: #ff80ab;
    font-size: 17px;
    font-weight: bold;
    text-shadow: 0 0 10px #ff174d;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

.you {
    position: relative;
    z-index: 5;
    color: white;
    font-size: 42px;
    font-weight: 900;
    text-shadow: 0 0 10px #ff174d,
                 0 0 25px #ff174d;
    animation: glow 1s infinite alternate;
}

@keyframes glow {
    from { scale: 1; }
    to { scale: 1.15; }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* MOBILE */
@media (max-width: 450px) {
    .container {
        transform: scale(0.85);
    }
}
</style>
</head>

<body>

<!-- CÂU HỎI ĐẦU TIÊN -->
<div class="question" id="question">
    <h1>💗 Một câu hỏi nhỏ...</h1>
    <p>Hôm nay bạn có thấy hạnh phúc không?</p>

    <div class="buttons">
        <button onclick="showHeart()">CÓ 💖</button>
        <button onclick="showHeart()">KHÔNG 🥺</button>
        <button class="skip" onclick="showHeart()">
            BỎ QUA ✨
        </button>
    </div>
</div>

<!-- TRÁI TIM -->
<div class="heart-screen" id="heartScreen">
    <div class="container">

        <div class="heart"></div>

        <div class="border-text" id="border"></div>

        <div class="you">YOU</div>

    </div>
</div>

<script>
function showHeart() {
    document.getElementById("question").style.display = "none";
    document.getElementById("heartScreen").style.display = "flex";
}

// Tạo chữ LOVE quanh trái tim
const border = document.getElementById("border");

for (let i = 0; i < 36; i++) {
    const span = document.createElement("span");
    span.textContent = "LOVE";
    span.style.transform = `rotate(${i * 10}deg)`;
    border.appendChild(span);
}
</script>

</body>
</html>
